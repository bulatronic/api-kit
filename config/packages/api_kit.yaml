# config/packages/api_kit.yaml
api_kit:
    response:
        format: json
        include_timestamp: true
        pretty_print: '%kernel.debug%'

    validation:
        translate_messages: true

    exception_handling:
        log_errors: true
        show_trace: '%kernel.debug%'
