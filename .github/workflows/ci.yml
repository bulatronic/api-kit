name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# No secrets are used anywhere in this workflow — composer install only hits
# public Packagist/GitHub, and the docker job never pushes an image.
permissions:
  contents: read

jobs:
  quality:
    name: "Tests / PHPStan / CS (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # phpunit/phpunit ^13 (require-dev) needs PHP >=8.4.1, so that's the
        # practical floor for CI even though composer.json's own "require"
        # claims php >=8.2 for consumers — the dev-tooling constraint and the
        # library's runtime constraint are not the same thing.
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        # Pinned by major (v4). To pin by immutable SHA instead:
        #   uses: actions/checkout@<40-char-commit-sha> # v4.x.x
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        # Pinned by major (v2). To pin by immutable SHA instead:
        #   uses: shivammathur/setup-php@<40-char-commit-sha> # v2.x.y
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, zip
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        # Pinned by major (v4). To pin by immutable SHA instead:
        #   uses: actions/cache@<40-char-commit-sha> # v4.x.x
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run test suite
        run: composer test

      - name: Run PHPStan
        run: composer phpstan

      - name: Check code style
        run: composer cs-check

  docker-sandbox:
    name: Dev sandbox image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # Pinned by major (v3). To pin by immutable SHA instead:
        #   uses: docker/setup-buildx-action@<40-char-commit-sha> # v3.x.x
        uses: docker/setup-buildx-action@v3

      - name: Build dev sandbox image (no push)
        # Pinned by major (v6). To pin by immutable SHA instead:
        #   uses: docker/build-push-action@<40-char-commit-sha> # v6.x.x
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: api-kit-dev-sandbox:ci
